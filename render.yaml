# Blueprint Render pour l'API Plume.
# La base PostgreSQL n'est pas créée ici : Render Free Postgres expire après
# 30 jours et ne convient pas à un déploiement durable. Créez une base
# PostgreSQL durable (Neon, Supabase, Railway, VPS) et renseignez DATABASE_URL.
# Le service web gratuit Render peut se mettre en veille ; l'URL reste stable.
# Pour une vraie production : SEED_DEMO=false, CORS_ORIGINS réel, sauvegardes.

services:
  - type: web
    name: plume-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --workspace @plume/api --workspace @plume/shared
    startCommand: sh -c "npm run db:migrate --workspace @plume/api && if [ \"$SEED_DEMO\" = \"true\" ]; then npm run db:seed --workspace @plume/api; fi && npm run start --workspace @plume/api"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://plume.app
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # AI_PROVIDER=anthropic : coach Claude. Clé acceptée sous ANTHROPIC_API_KEY ou CLAUDE_API_KEY.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      # Comptes Gratuit : modèle économique.
      - key: ANTHROPIC_MODEL_FREE
        value: claude-haiku-5-5
      - key: SEED_DEMO
        value: "false"
      - key: PUBLIC_APP_URL
        value: https://plume-api-qk9s.onrender.com
      - key: EMAIL_PROVIDER
        value: console
      - key: RESEND_API_KEY
        sync: false
      # Sans nom de domaine : EMAIL_PROVIDER=brevo, BREVO_API_KEY, EMAIL_FROM = expéditeur vérifié dans Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: LEGAL_CONTACT_EMAIL
        value: plume.lecture.ia@gmail.com
